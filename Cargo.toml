[package]
name = "gitprism"
version = "0.1.7"
edition = "2024"
rust-version = "1.89"
description = "Synchronize filtered source and destination Git repositories without rewriting history"
license = "MIT"
repository = "https://github.com/blankmi/gitprism"
categories = ["command-line-utilities", "development-tools"]
keywords = ["git", "repository", "sync", "filtering"]
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
console = "0.16.4"
git2 = "0.21.0"
hmac = "0.12.1"
ignore = "0.4.33"
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
toml = "1.1.4"

[dev-dependencies]
tempfile = "3.27.0"
# Only for a test asserting the umask actually constrains a restored file's
# creation mode (RestoreMode::SubjectToUmask) — std has no umask API.
libc = "0.2.169"
